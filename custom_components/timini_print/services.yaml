print_text:
  name: Print text
  description: >-
    Prints a short text message via the TiMini Print Server add-on,
    using TiMini-Print's own native text rendering. Each print connects
    to the printer, sends the job, then disconnects (fire-and-forget) -
    there's no persistent connection to manage.
  fields:
    message:
      name: Message
      description: The text to print.
      required: true
      example: "Motion detected in the garage!"
      selector:
        text:
          multiline: true
    printer:
      name: Printer
      description: >-
        Optional printer name/address override (as shown by a scan), if
        you have more than one supported printer nearby. Leave blank to
        use the add-on's configured default, or the first supported
        printer found.
      required: false
      selector:
        text:
    text_columns:
      name: Characters per line
      description: >-
        Target characters per line - fewer means bigger printed text,
        more means smaller (matches the "Characters per line" setting
        in TiMini-Print's own Android app). Leave blank for
        TiMini-Print's own automatic default.
      required: false
      selector:
        number:
          min: 1
          max: 200
          step: 1
    darkness:
      name: Print darkness
      description: Printer thermal darkness, 1 (lightest) to 5 (darkest). Leave blank for the printer's own default.
      required: false
      selector:
        number:
          min: 1
          max: 5
          step: 1
    entry_id:
      name: Add-on connection
      description: Which configured TiMini Print add-on to use, if you have more than one. Defaults to the first configured one.
      required: false
      selector:
        text:

print_image:
  name: Print image or PDF
  description: >-
    Prints an image or PDF file via the TiMini Print Server add-on. The
    file must be somewhere Home Assistant is allowed to read (under
    /config or /media by default, or a folder listed in
    'allowlist_external_dirs').
  fields:
    file_path:
      name: File path
      description: Full path to a .png, .jpg, .jpeg, .gif, .bmp, or .pdf file readable by Home Assistant.
      required: true
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    printer:
      name: Printer
      description: Optional printer name/address override, same as print_text.
      required: false
      selector:
        text:
    darkness:
      name: Print darkness
      description: Printer thermal darkness, 1 (lightest) to 5 (darkest). Leave blank for the printer's own default.
      required: false
      selector:
        number:
          min: 1
          max: 5
          step: 1
    entry_id:
      name: Add-on connection
      description: Which configured TiMini Print add-on to use, if you have more than one. Defaults to the first configured one.
      required: false
      selector:
        text:

print_image_data:
  name: Print image data (advanced)
  description: >-
    Prints an image or PDF given directly as base64-encoded data,
    rather than a file path Home Assistant needs read access to. This
    is what the bundled TiMini Print Lovelace card uses internally for
    its file-upload button - most people won't need to call this
    service by hand.
  fields:
    image_b64:
      name: Image data (base64)
      description: Base64-encoded file contents.
      required: true
      selector:
        text:
    filename:
      name: File name
      description: Original file name, used only to detect the format from its extension (.png/.jpg/.jpeg/.gif/.bmp/.pdf).
      required: true
      example: "photo.jpg"
      selector:
        text:
    printer:
      name: Printer
      description: Optional printer name/address override, same as print_text.
      required: false
      selector:
        text:
    darkness:
      name: Print darkness
      description: Printer thermal darkness, 1 (lightest) to 5 (darkest). Leave blank for the printer's own default.
      required: false
      selector:
        number:
          min: 1
          max: 5
          step: 1
    entry_id:
      name: Add-on connection
      description: Which configured TiMini Print add-on to use, if you have more than one. Defaults to the first configured one.
      required: false
      selector:
        text:

scan:
  name: Scan for printers (advanced)
  description: >-
    Scans for supported printers via the TiMini Print Server add-on
    and returns the results as response data. This is what the bundled
    Lovelace card's "Scan" button uses internally to populate its
    printer picker - most people won't need to call this by hand.
  fields:
    entry_id:
      name: Add-on connection
      description: Which configured TiMini Print add-on to use, if you have more than one. Defaults to the first configured one.
      required: false
      selector:
        text:
